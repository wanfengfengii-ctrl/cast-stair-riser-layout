name: stair-layout

services:
  api:
    build: ./api
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  web:
    build: ./web
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # 经 nginx 代理访问 API，同时验证代理链路
      test: ["CMD", "wget", "-qO-", "http://localhost/api/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  # 一次性验收服务：真实浏览器经 Web 代理跑通主链路后退出
  verify:
    build:
      context: .
      dockerfile: verify/Dockerfile
    profiles: ["verify"]
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    environment:
      WEB_BASE_URL: http://web
      API_BASE_URL: http://api:8000
